<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Flashcards')}"></head>
<body>
<header th:replace="~{layout/base :: nav}"></header>

<main id="main" class="container page container-narrow flashcard-page"
      th:attr="data-review-url=@{/api/study-packs/{id}/flashcards/review(id=${pack.id})}">
    <p class="back-link"><a th:href="@{/study-packs/{id}(id=${pack.id})}">← Back to study package</a></p>

    <div class="page-head">
        <div>
            <p class="eyebrow" th:text="${pack.title}">Study package</p>
            <h1>Flashcards</h1>
        </div>
        <div class="flashcard-counter">
            <span id="card-position">1</span> of <span th:text="${#lists.size(pack.flashcards)}">12</span>
        </div>
    </div>

    <div class="flashcard-stage" id="flashcard-stage" aria-live="polite">
        <div class="flashcard">
            <p class="flashcard-face-label">Question</p>
            <p class="flashcard-front" id="flashcard-front">Loading card…</p>
            <div class="flashcard-answer" id="flashcard-answer" hidden>
                <p class="flashcard-face-label">Answer</p>
                <p class="flashcard-back" id="flashcard-back"></p>
                <p class="source-line" id="flashcard-source"></p>
            </div>
        </div>
    </div>

    <div class="flashcard-controls">
        <button class="btn btn-secondary" id="card-prev" type="button">Previous</button>
        <button class="btn btn-primary" id="card-reveal" type="button">Reveal answer</button>
        <button class="btn btn-secondary" id="card-next" type="button">Next</button>
    </div>

    <div class="panel flashcard-finish">
        <div>
            <h2>Finished this set?</h2>
            <p class="muted">Record the review to add it to your study activity. Reviewed
                <strong id="reviewed-count">0</strong> cards in this session.</p>
        </div>
        <button class="btn btn-secondary" id="finish-review" type="button">Finish review</button>
    </div>

    <p class="field-hint">Use the arrow keys to move between cards and Space to reveal the answer.</p>

    <script th:inline="javascript">
        window.flashcardData = /*[[${pack.flashcards}]]*/ [];
    </script>
</main>

<footer th:replace="~{layout/base :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/flashcards.js}"></script>
</body>
</html>
