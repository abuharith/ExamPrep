spring:
  application:
    name: ExamPrep
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/examprep}
    username: ${SPRING_DATASOURCE_USERNAME:examprep}
    password: ${SPRING_DATASOURCE_PASSWORD:examprep}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${APP_MAX_UPLOAD_SIZE_MB:25}MB
      max-request-size: ${APP_MAX_UPLOAD_SIZE_MB:25}MB
  thymeleaf:
    cache: false
  messages:
    basename: messages
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    whitelabel:
      enabled: false

examprep:
  storage:
    location: ${APP_STORAGE_LOCATION:./data/uploads}
  upload:
    max-size-mb: ${APP_MAX_UPLOAD_SIZE_MB:25}
  async:
    core-pool-size: ${APP_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${APP_ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:200}
  ai:
    api-key: ${GOOGLE_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:90}
    max-attempts: ${GEMINI_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${GEMINI_RETRY_BACKOFF_MS:1500}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:8192}
  generation:
    # Total number of source characters handed to a single generation call.
    max-source-chars: ${APP_GENERATION_MAX_SOURCE_CHARS:60000}
    # Documents larger than this are summarised section by section first.
    summarise-threshold-chars: ${APP_GENERATION_SUMMARISE_THRESHOLD_CHARS:60000}

logging:
  level:
    root: INFO
    com.examprep: INFO
    org.flywaydb: INFO
    # Never log SDK request payloads: they contain student material and the key header.
    com.google.genai: WARN
